name: Publish fork update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Zhangkuns/zotero-feishu-note'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
      - name: Publish immutable version and update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release
